[project]
name = "droidforge-sidecar"
version = "0.1.0"
description = "DroidForge MCP Python Sidecar for Perfetto trace analysis and media verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "perfetto>=0.11.0",
]

[project.scripts]
df-analyze-trace = "df_analyze_trace:main"
df-verify-media = "df_verify_media:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["df_analyze_trace.py", "df_verify_media.py"]
